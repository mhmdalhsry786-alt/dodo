<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دودو">
<title>دودو — تحديث الرابط</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma;background:#0b1220;color:#e2e8f0;margin:0;padding:22px;min-height:100vh}
.card{max-width:520px;margin:0 auto;background:#111c31;border:1px solid #1f2f4a;border-radius:16px;padding:20px}
h1{font-size:20px;margin:0 0 6px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:16px;line-height:1.7}
.row{background:#0d1728;border:1px solid #1f2f4a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;word-break:break-all;font-family:ui-monospace,monospace}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-inline-end:6px}
.ok{background:#064e3b;color:#6ee7b7}
.bad{background:#4c1d1d;color:#fca5a5}
.yes{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:17px;font-weight:700;margin-top:16px}
.yes:active{transform:scale(.99)}
.alt{background:#1e293b;color:#cbd5e1;font-size:14px;margin-top:10px}
.btn2{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#1e293b;color:#cbd5e1;font-size:15px;margin-top:10px}
.msg{margin-top:14px;font-size:13px;line-height:1.8;color:#93c5fd}
.step{font-size:12px;color:#64748b;margin-top:14px;line-height:1.9}
</style>
</head>
<body>
<div class="card">
  <h1>🔄 تحديث رابط دودو</h1>
  <div class="sub">هذه الصفحة تعرف <b>آخر رابط</b> نشره اللابتوب. اضغط «نعم» للانتقال إلى النسخة التي تعمل الآن.</div>

  <div style="font-size:12px;color:#64748b">الحالة:</div>
  <div id="status" class="row">جارٍ الفحص…</div>

  <div id="urls"></div>

  <button id="yes" class="yes" style="display:none">نعم — افتح النسخة التي تعمل</button>
  <button id="retry" class="btn2" style="display:none">إعادة الفحص</button>
  <div class="alt" id="lanWrap" style="display:none">
    <button id="lan" class="btn2" style="margin-top:0">📶 أنا على نفس شبكة اللابتوب — افتح المحلي (أسرع)</button>
  </div>

  <div id="msg" class="msg"></div>
  <div class="step">
    1) الصفحة الثابتة: <b>github.io/dodo/update.html</b><br>
    2) تعرض آخر رابط نشره اللابتوب تلقائيًا<br>
    3) بعد إعادة تشغيل اللابتوب: يتغيّر الرابط — تُحدَّث هذه الصفحة وحدها
  </div>
</div>

<script>
var INVITE='DODO2026', TOPIC='dodo-f11c4d4c';
var CAND=[], LAN='';

function el(id){return document.getElementById(id)}
function setStatus(cls,txt){var e=el('status');e.innerHTML='<span class="tag '+cls+'">'+(cls==='ok'?'يعمل':'غير متاح')+'</span>'+txt}

function probe(url,ms){
  return new Promise(function(res,rej){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;rej('timeout')}},ms||7000);
    fetch(url,{mode:'cors',cache:'no-store'}).then(function(r){
      if(!done){done=true;clearTimeout(t); r.ok?res(url):rej('http'+r.status)}
    }).catch(function(e){if(!done){done=true;clearTimeout(t);rej('net')}});
  });
}

function loadCandidates(){
  // 1) من القناة (كل الرسائل، الأحدث زمنيًا يفوز)
  return fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1&since=all',{cache:'no-store'})
    .then(function(r){return r.text()})
    .then(function(txt){
      var bestTun={t:0,u:''}, bestLan={t:0,u:''};
      txt.trim().split(/\n+/).forEach(function(line){
        try{
          var m=JSON.parse(line), msg=m.message||'', t=m.time||0;
          var lan=msg.match(/LAN\s+(http:\/\/[0-9.]+:\d+\/?)/i);
          var tun=msg.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
          if(lan && t>bestLan.t) bestLan={t:t,u:lan[1]};
          if(tun && t>bestTun.t) bestTun={t:t,u:tun[0]};
        }catch(e){}
      });
      LAN = bestLan.u;
      CAND = [];
      if(bestLan.u) CAND.push({kind:'lan', u:bestLan.u.replace(/\/$/,'')+'/?invite='+INVITE});
      if(bestTun.u) CAND.push({kind:'tunnel', u:bestTun.u+'/?invite='+INVITE});
      // 2) احتياط: آخر رابط محفوظ محليًا على الهاتف
      var saved=localStorage.getItem('dodo_last_url');
      if(saved && CAND.every(function(c){return c.u!==saved})) CAND.push({kind:'saved', u:saved});
    })
    .catch(function(){ CAND=[]; var s=localStorage.getItem('dodo_last_url'); if(s)CAND.push({kind:'saved',u:s}); });
}

function render(){
  var box=el('urls'); box.innerHTML='';
  if(!CAND.length){
    setStatus('bad','لا يوجد أي رابط منشور');
    el('msg').textContent='شغّل اللابتوب — سينشر رابطه تلقائيًا خلال دقيقة، ثم اضغط «إعادة الفحص».';
    el('retry').style.display='block'; el('yes').style.display='none';
    return Promise.resolve();
  }
  var checks = CAND.map(function(c){
    var row=document.createElement('div'); row.className='row';
    row.innerHTML='<span class="tag bad" id="t_'+c.kind+'">…</span>'+(c.kind==='lan'?'محلي: ':(c.kind==='saved'?'محفوظ: ':'نفق: '))+c.u;
    box.appendChild(row);
    return probe('https://'+location.host+'/__probe__') // placeholder, replaced below
  });
  // فحص فعلي لكل مرشح عبر <img> لتفادي CORS النهائي
  var working=[];
  return new Promise(function(resolve){
    var pending=CAND.length;
    CAND.forEach(function(c){
      var img=new Image(), done=false, t=setTimeout(function(){fin()},6500);
      function fin(ok){
        if(done)return; done=true; clearTimeout(t);
        var tag=document.getElementById('t_'+c.kind);
        if(tag){tag.className='tag '+(ok?'ok':'bad'); tag.textContent=ok?'يعمل':'غير متاح';}
        if(ok) working.push(c);
        if(--pending===0){ resolve(working); }
      }
      img.onload=function(){fin(true)};
      img.onerror=function(){fin(false)};
      img.src=c.u.split('?')[0].replace(/\/$/,'')+'/favicon.png?_='+Date.now();
      setTimeout(function(){fin(false)},6800);
    });
    if(!CAND.length) resolve([]);
  }).then(function(w){
    if(w.length){
      setStatus('ok','وُجد رابط يعمل');
      el('yes').style.display='block';
      el('yes').onclick=function(){
        var pick=w[0];
        localStorage.setItem('dodo_last_url', pick.u);
        location.replace(pick.u);
      };
      if(w.some(function(c){return c.kind==='lan'})){
        el('lanWrap').style.display='block';
        el('lan').onclick=function(){
          var pick=w.filter(function(c){return c.kind==='lan'})[0];
          localStorage.setItem('dodo_last_url', pick.u);
          location.replace(pick.u);
        };
      }
    }else{
      setStatus('bad','الروابط المنشورة لا تستجيب');
      el('msg').textContent='اللابتوب لم يُشغّل دودو بعد، أو أنت على شبكة مختلفة. شغّل اللابتوب ثم اضغط «إعادة الفحص».';
      el('retry').style.display='block';
    }
  });
}

function go(){
  el('retry').onclick=function(){el('retry').style.display='none';el('msg').textContent='جارٍ الفحص…';loadCandidates().then(render)};
  loadCandidates().then(render);
}
go();
</script>
</body>
</html>
