<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دودو</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دودو">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#111c31;--line:#1f2f4a;--txt:#e2e8f0;--dim:#94a3b8;--blue:#2563eb;--grn:#6ee7b7;--red:#fca5a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Tahoma;background:var(--bg);color:var(--txt);
     padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);min-height:100vh}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 10px currentColor}
.dot.ok{background:var(--grn)}.dot.bad{background:var(--red)}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(31,47,74,.6);font-size:13px}
.row:last-child{border-bottom:0}
.row .nm{flex:1;word-break:break-all;font-family:ui-monospace,monospace;font-size:12px;color:#cbd5e1}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:600}
.b-wait{background:#3b2f10;color:#fbbf24}
.b-ok{background:#064e3b;color:var(--grn)}
.b-bad{background:#4c1d1d;color:var(--red)}
button{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px}
.go{background:var(--blue);color:#fff}
.go:disabled{opacity:.45}
.ghost{background:#1e293b;color:#cbd5e1;font-size:15px;padding:13px}
.msg{font-size:13px;color:#93c5fd;line-height:1.8;margin-top:10px;min-height:20px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1220;display:none;z-index:50}
body.app #frame{display:block}
body.app .wrap{display:none}
#bar{position:fixed;top:0;left:0;right:0;height:0;z-index:60;display:none}
.foot{font-size:11px;color:#475569;text-align:center;margin-top:16px;line-height:1.8}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
      border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<iframe id="frame" src="about:blank" allow="fullscreen; autoplay; clipboard-write" referrerpolicy="no-referrer"></iframe>
<div id="bar"></div>
<div class="wrap">
  <h1><span id="dot" class="dot"></span> دودو</h1>
  <div class="sub">يفحص اللابتوب تلقائيًا كل مرة تفتح فيها التطبيق — لا تحتاج إعدادًا.</div>

  <div class="card">
    <div class="row"><span class="nm">الشبكة المحلية</span><span id="b-lan" class="badge b-wait">…</span></div>
    <div class="row"><span class="nm">عبر الإنترنت (نفق)</span><span id="b-tun" class="badge b-wait">…</span></div>
    <div class="row"><span class="nm" id="last-seen">آخر اتصال ناجح: —</span></div>
  </div>

  <button id="go" class="go" disabled>جارٍ الفحص…</button>
  <button id="again" class="ghost">إعادة الفحص</button>
  <div id="msg" class="msg"></div>

  <div class="foot">
    أضِف هذا التطبيق لشاشة الهاتف الرئيسية مرة واحدة،<br>
    وبعدها كل فتح = اتصال تلقائي باللابتوب.
  </div>
</div>

<script>
var INVITE='DODO2026';
var NTFY='https://ntfy.sh/dodo-f11c4d4c/json?poll=1&since=all';
var CAND=[];

function $(id){return document.getElementById(id)}
function badge(id,state,text){
  var e=$(id); if(!e)return;
  e.className='badge '+(state==='ok'?'b-ok':state==='bad'?'b-bad':'b-wait');
  e.textContent=text;
}
function setDot(state){var d=$('dot');d.className='dot'+(state==='ok'?' ok':state==='bad'?' bad':'')}

// فحص الرابط: نجرّب fetch ثم صورة (لتجاوز أي قيود CORS)
function probe(url,ms){
  ms=ms||7000;
  return new Promise(function(resolve){
    var done=false;
    function fin(ok){ if(done)return; done=true; resolve(ok); }
    var t=setTimeout(function(){fin(false)},ms);
    fetch(url,{mode:'cors',cache:'no-store',signal:(AbortSignal.timeout?AbortSignal.timeout(ms):undefined)})
      .then(function(r){clearTimeout(t);fin(!!r && (r.ok||r.status===401||r.status===403))})
      .catch(function(){
        var img=new Image(); var d2=false;
        function f(ok){if(d2)return;d2=true;clearTimeout(t);fin(ok)}
        img.onload=function(){f(true)}; img.onerror=function(){f(false)};
        img.src=url.split('?')[0].replace(/\/$/,'')+'/favicon.png?_='+Date.now();
        setTimeout(function(){f(false)},ms);
      });
  });
}

// 1) اقرأ آخر رابط نشره اللابتوب على القناة
function discover(){
  return fetch(NTFY,{cache:'no-store'})
    .then(function(r){return r.text()})
    .then(function(txt){
      var bestTun={t:0,u:''}, bestLan={t:0,u:''};
      txt.trim().split(/\n+/).forEach(function(line){
        try{
          var m=JSON.parse(line), msg=m.message||'', t=m.time||0;
          var lan=msg.match(/LAN\s+(http:\/\/[0-9.]+:\d+\/?)/i);
          var tun=msg.match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/i);
          if(lan && t>bestLan.t) bestLan={t:t,u:lan[1]};
          if(tun && t>bestTun.t) bestTun={t:t,u:tun[0]};
        }catch(e){}
      });
      CAND=[];
      if(bestLan.u) CAND.push({k:'lan', u:bestLan.u.replace(/\/$/,'')+'/?invite='+INVITE});
      if(bestTun.u) CAND.push({k:'tun', u:bestTun.u+'/?invite='+INVITE});
      var saved=localStorage.getItem('dodo_last');
      if(saved && CAND.every(function(c){return c.u!==saved})) CAND.push({k:'saved',u:saved});
      return CAND;
    })
    .catch(function(){
      CAND=[]; var s=localStorage.getItem('dodo_last');
      if(s) CAND.push({k:'saved',u:s});
      return CAND;
    });
}

// 2) افحص كل مرشح بالتوازي
function check(){
  badge('b-lan','wait','…'); badge('b-tun','wait','…');
  setDot(''); $('go').disabled=true; $('go').innerHTML='<span class="spin"></span>جارٍ الفحص…';
  var stored=localStorage.getItem('dodo_last_ok');
  $('last-seen').textContent='آخر اتصال ناجح: '+(stored?new Date(parseInt(stored)).toLocaleString('ar-EG'):'—');

  return discover().then(function(list){
    if(!list.length){
      setDot('bad'); $('go').innerHTML='لا يوجد رابط منشور'; $('msg').textContent='شغّل اللابتوب — سينشر رابطه تلقائيًا خلال دقيقة.';
      badge('b-lan','bad','—'); badge('b-tun','bad','—'); return;
    }
    var jobs=list.map(function(c){
      var id = c.k==='lan'?'b-lan':(c.k==='tun'?'b-tun':null);
      return probe(c.u,7000).then(function(ok){
        if(id) badge(id,ok?'ok':'bad',ok?'يعمل':'غير متاح');
        return {c:c, ok:ok};
      });
    });
    return Promise.all(jobs).then(function(results){
      var working=results.filter(function(r){return r.ok}).map(function(r){return r.c});
      if(working.length){
        setDot('ok');
        $('go').disabled=false;
        $('go').innerHTML='فتح دودو';
        $('go').onclick=function(){
          localStorage.setItem('dodo_last', working[0].u);
          localStorage.setItem('dodo_last_ok', Date.now());
          openInApp(working[0].u);
        };
        $('msg').textContent=''; 
        // اتصال تلقائي إن كان هناك رابط يعمل ومرّ أكثر من 3 ثوان
        setTimeout(function(){ if(!document.hidden) $('go').click(); }, 1200);
      }else{
        setDot('bad');
        $('go').disabled=true;
        $('go').innerHTML='اللابتوب غير متاح';
        $('msg').textContent='اللابتوب مغلق أو على شبكة مختلفة. افتحه وسيُكتشف تلقائيًا عند إعادة الفحص.';
      }
    });
  });
}

// فتح السيرفر داخل نفس التطبيق (بلا قفزة لمتصفح)
function openInApp(url){
  var f=$('frame');
  try{ f.src=url; }catch(e){ location.replace(url); return; }
  document.body.classList.add('app');
  // سجل حقيقي: زر الرجوع يرجعك لشاشة الحالة لا يخرجك من التطبيق
  try{ history.pushState({dodo:1}, '', '#app'); }catch(e){}
  // مهلة تعافٍ: إن لم يُحمّل شيء خلال 12 ثانية نرجع لشاشة الحالة
  window._guard=setTimeout(function(){
    // فحص خفيف: هل الإطار استجاب؟
    try{
      var ok=false;
      try{ ok = !!(f.contentWindow && f.contentWindow.location && f.contentWindow.location.href && f.contentWindow.location.href!=='about:blank'); }catch(e){ ok=true; }
      if(!ok) backToStatus('تعذر تحميل الواجهة — قد يكون اللابتوب أغلق. الفحص مرة أخرى.');
    }catch(e){ backToStatus(''); }
  }, 12000);
}

function revertUI(msg){
  clearTimeout(window._guard);
  document.body.classList.remove('app');
  $('frame').src='about:blank';
  if(msg) $('msg').textContent=msg;
  check();
}

function backToStatus(msg){
  if(location.hash==='#app'){
    try{ history.back(); }catch(e){ revertUI(msg); }
    // إن لم يحدث popstate (بعض المتصفحات) نرجع يدويًا بعد لحظة
    setTimeout(function(){ if(document.body.classList.contains('app')) revertUI(msg); }, 120);
  } else {
    revertUI(msg);
  }
}

// زر الرجوع في iOS/المتصفح: من الإطار إلى شاشة الحالة (بلا خروج من التطبيق)
window.addEventListener('popstate', function(){
  if(document.body.classList.contains('app')) revertUI('');
});

$('again').onclick=function(){$('msg').textContent='جارٍ الفحص…';check()};

// كل فتح/عودة للتطبيق = فحص جديد تلقائي
document.addEventListener('visibilitychange',function(){
  if(!document.hidden && !document.body.classList.contains('app')) check();
});
window.addEventListener('pageshow',function(){
  if(!document.body.classList.contains('app')) check();
});
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
check();
</script>
</body>
</html>
